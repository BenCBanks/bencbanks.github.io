<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}/feed.xml">
  {% seo %}
  {% if jekyll.environment == "production" %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZBXQJD05EF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZBXQJD05EF');
  </script>
  {% endif %}
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="Ben Banks, home">Ben Banks<span class="logo-dot" aria-hidden="true">.</span></a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>About</a></li>
      <li><a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' or page.layout == 'post' or page.layout == 'list' %} class="active" aria-current="page"{% endif %}>Projects</a></li>
      <li><a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact' %} class="active" aria-current="page"{% endif %}>Contact</a></li>
    </ul>
  </nav>
</header>

<main class="site-main{% if page.url == '/contact/' %} site-main-contact{% endif %}" id="main-content">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p>© {{ 'now' | date: '%Y' }} Ben Banks</p>
    <div class="footer-links"><a href="{{ '/contact/' | relative_url }}">Contact</a><a href="https://www.linkedin.com/in/benjamin-banks" target="_blank" rel="noopener noreferrer">LinkedIn</a></div>
  </div>
</footer>

</body>
</html>
