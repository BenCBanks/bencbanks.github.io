---
layout: default
---
<header class="page-header"><p class="eyebrow">Topic</p><h1>{{ page.title }}<span class="heading-dot">.</span></h1><a class="text-link" href="{{ '/projects/' | relative_url }}">← All projects</a></header>
{% assign filtered = site.posts | where_exp: "post", "post.tags contains page.slug" %}
<div class="project-rows">
  {% for post in filtered %}
    {% include project-card.html post=post %}
  {% endfor %}
</div>
