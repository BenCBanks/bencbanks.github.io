---
layout: default
---
<article class="article-page">
  <a href="{{ '/projects/' | relative_url }}" class="post-back">← All projects</a>
  <header class="post-header">
    <div class="project-meta"><span>{{ page.topic | default: page.type }} / {{ page.type }}</span><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
  </header>
  <div class="post-content">{{ content }}</div>
  <footer class="article-footer"><p class="eyebrow">Keep exploring</p><a class="text-link" href="{{ '/projects/' | relative_url }}">See all projects <span aria-hidden="true">↗</span></a></footer>
</article>
